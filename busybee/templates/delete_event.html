{% extends 'base.html' %}

{% block title %}Delete Event{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
        <h2 class="text-danger mb-3">🗑 Delete Event</h2>
        <p>Are you sure you want to delete the event <strong>"{{ event.title }}"</strong>?</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="{{ request.META.HTTP_REFERER|default:'/account/' }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
